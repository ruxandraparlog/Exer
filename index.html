<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schola Latina - RPG Edu</title>
    <style>
        :root {
            --bg-dark: #0f0f1b;
            --panel-bg: #1b1b2f;
            --accent-gold: #f39c12;
            --accent-crimson: #e74c3c;
            --accent-green: #2ecc71;
            --accent-blue: #3498db;
            --text-light: #ecf0f1;
            --border-color: #f1c40f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 12px;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        /* HEADER */
        header {
            background: var(--panel-bg);
            border: 3px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        header h1 {
            color: var(--accent-gold);
            font-size: 1.6rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        header p {
            font-size: 0.9rem;
            color: #bdc3c7;
        }

        /* TAB BAR */
        .nav-bar {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        @media (min-width: 600px) {
            .nav-bar {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .tab-btn {
            background: var(--panel-bg);
            color: var(--accent-gold);
            border: 2px solid var(--border-color);
            padding: 12px 6px;
            font-size: 0.95rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-gold);
            color: #000;
            box-shadow: 0 0 12px rgba(243, 156, 18, 0.6);
        }

        /* SECTIONS */
        .content-section {
            display: none;
            background: var(--panel-bg);
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .content-section.active {
            display: block;
        }

        .section-header {
            color: var(--accent-gold);
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 15px;
            font-size: 1.2rem;
        }

        /* TEORIE CARD */
        .theory-card {
            background: #2c3e50;
            border-left: 5px solid var(--accent-crimson);
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .theory-card h3 {
            color: var(--accent-gold);
            margin-bottom: 6px;
        }

        .theory-card ul {
            margin-left: 20px;
        }

        /* RPG DIALOGUE */
        .rpg-box {
            background: #000;
            border: 2px solid var(--accent-gold);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
        }

        .avatar {
            font-size: 3rem;
            margin-bottom: 5px;
        }

        .speaker-name {
            color: var(--accent-crimson);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .dialog-latin {
            color: var(--accent-gold);
            font-size: 1.2rem;
            font-weight: bold;
            margin: 10px 0;
            background: #111;
            padding: 10px;
            border-radius: 6px;
        }

        .dialog-ro {
            font-style: italic;
            color: #ecf0f1;
            margin-bottom: 10px;
        }

        .dialog-grammar {
            font-size: 0.85rem;
            background: #222;
            color: #2ecc71;
            padding: 8px;
            border-radius: 4px;
            text-align: left;
        }

        .rpg-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
